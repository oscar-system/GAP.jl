name: CI with GAP

on:
  push:
    branches:
      - 'master'
      - 'release-*'
    tags: '*'
  pull_request:
  schedule:
      # Every day at 3:08 AM UTC
      - cron: '8 3 * * *'
  workflow_dispatch:

concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the default repository branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - GAP ${{ matrix.gap-version }} - ${{ matrix.os }}${{ matrix.validate-marking && ' - VALIDATE_MARKING' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.julia-version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        gap-version:
          - 'master'
          - 'stable-4.16'
        julia-version:
          - '1'         # latest stable release
          - '1.13-nightly'
          - 'nightly'
        os:
          - ubuntu-latest
        validate-marking:
          - false
        include:
          # Add a few macOS jobs (the number we can run in parallel is limited)
          - gap-version: 'master'
            julia-version: '1'
            os: macOS-latest
          - gap-version: 'stable-4.16'
            julia-version: '1'
            os: macOS-latest
          # build the Julia GC integration with VALIDATE_MARKING, to detect
          # invalid references during GC marking (see issue #1364)
          - gap-version: 'master'
            julia-version: '1'
            os: ubuntu-latest
            validate-marking: true

    steps:
      - uses: actions/checkout@v7
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        id: setup-julia
        with:
          version: ${{ matrix.julia-version }}
      - name: Checkout GAP
        uses: actions/checkout@v7
        with:
          repository: 'gap-system/gap'
          ref: ${{ matrix.gap-version }}
          path: 'GAPROOT'
      - name: "Install dependencies (for macOS)"
        if: runner.os == 'macOS'
        run: |
          # - autoconf, gmp, zlib are needed by GAP's build system
          # - coreutils provides nproc
          # - force use of Homebrew gcc to build GAP for proper stacktrace support
          #   Homebrew installs versioned binaries such as gcc-14 and g++-14,
          #   while later scripts expect unversioned gcc and g++ in PATH.
          brew install autoconf gmp zlib gcc@14 coreutils

          # ensure gcc and g++ are available under those names (on macOS,
          # these names are aliases for clang / clang++ out of the box)
          shimdir="${HOME}/bin"
          mkdir -p "${shimdir}"
          ln -sf "$(brew --prefix)/bin/gcc-14" "${shimdir}/gcc"
          ln -sf "$(brew --prefix)/bin/g++-14" "${shimdir}/g++"
          echo "${shimdir}" >> "${GITHUB_PATH}"
      - name: "Build GAP"
        run: |
          # absolute path: the patches are applied from inside the GAP
          # checkout below, where a relative path would not be found and the
          # patches would silently be skipped
          patchdir=${GITHUB_WORKSPACE}/.github/workflows/GAP_patches/${{ matrix.gap-version }}
          mv GAPROOT /tmp/GAPROOT
          cd /tmp/GAPROOT
          if [ -d $patchdir ]; then
            for f in $patchdir/*.patch; do
              echo "Applying patch ${f}"
              patch -p1 -d . < ${f}
            done
          fi
          ./autogen.sh
          ./configure
          make -j`nproc`
      - name: "Override bundled GAP"
        run: |
          julia --project etc/setup_override_dir.jl /tmp/GAPROOT /tmp/gap_jll_override ${{ matrix.validate-marking && '--validate-marking' || '' }}
      - name: "Run tests"
        run: |
           julia --project etc/run_with_override.jl /tmp/gap_jll_override --depwarn=error -e "using Pkg; Pkg.test(\"GAP\")"

